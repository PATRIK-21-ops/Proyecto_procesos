services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hellfall
      POSTGRES_USER: hellfall
      POSTGRES_PASSWORD: hellfall_local_only
    ports:
      - "5432:5432"
    volumes:
      - hellfall_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hellfall -d hellfall"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 8080
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET en .env}
      DATABASE_URL: postgres://hellfall:hellfall_local_only@postgres:5432/hellfall
      PGSSL: disable
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Configura ADMIN_EMAIL en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD en .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_SCORE_KILLS: ${MAX_SCORE_KILLS:-100}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  hellfall_pg_data:
